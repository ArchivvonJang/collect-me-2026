<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef3f8">
<title>올해의 나 수집하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: 가운데 한 줄(최대 560px) — 이름 선택 · 날짜(목록·달력 아이콘) · 주제 칩 · 하루 한 질문 카드 캐러셀, 테마 버튼은 우측 하단 고정 */
:root{
  --bg:#eef3f8; --bg2:#e1eaf3; --card:#ffffff; --ink:#24303d; --sub:#6b7b8c; --line:#d9e3ed;
  --accent:#4a82c3; --soft:#e4eef9; --snow:#a9c3df; --shadow:rgba(60,95,135,.16);
  --t0:#4f8fcc; --t1:#8f78cf; --t2:#2f9c80; --t3:#d77757; --t4:#b8922a;
  /* 사람 색: 수연 오렌지 · 지아 파랑 · 주연 올리브 · 주영 분홍 */
  --p0:#c9661c; --p1:#3f78bb; --p2:#6c7a1e; --p3:#c94f7c;
  /* 이름 칩 배경: 흰 글씨가 읽히도록 두 테마 공통의 진한 값 */
  --pcs0:#d26a1e; --pcs1:#3f78bb; --pcs2:#6f7c22; --pcs3:#cc5381; --on:#ffffff;
  --snowfill:#ffffff; --snowline:#cfdcea; --smoke:#9fb0c3;
  --day-top:#c9e1f6; --day-bot:#eef4fa;
  --sky-ink-day:#24303d; --sky-sub-day:#5f6f80; --sky-ink-night:#eef3f9; --sky-sub-night:#b3c1d1;
  --on-sky:var(--sky-ink-day); --on-sky-sub:var(--sky-sub-day);
  --f-display:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-mode="light"]){
    --bg:#0e151e; --bg2:#131c28; --card:#18222e; --ink:#e5ecf4; --sub:#8b9bad; --line:#28364a;
    --accent:#82b2e8; --soft:#1e2b3b; --snow:#dbe8f5; --shadow:rgba(0,0,0,.45);
    --t0:#7fb3e6; --t1:#b3a1ec; --t2:#5fc5a8; --t3:#f0a084; --t4:#e1bf5f;
    --p0:#f2a25e; --p1:#82b2e8; --p2:#b8c45c; --p3:#ef8aac;
    --snowfill:#e6edf5; --snowline:#3a4a5e; --smoke:#8394a8;
    --day-top:#2b4566; --day-bot:#18263a;
    --sky-ink-day:#e5ecf4; --sky-sub-day:#a3b2c3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-mode="light"]),:root[data-mode="dark"]{
  --bg:#0e151e; --bg2:#131c28; --card:#18222e; --ink:#e5ecf4; --sub:#8b9bad; --line:#28364a;
  --accent:#82b2e8; --soft:#1e2b3b; --snow:#dbe8f5; --shadow:rgba(0,0,0,.45);
  --t0:#7fb3e6; --t1:#b3a1ec; --t2:#5fc5a8; --t3:#f0a084; --t4:#e1bf5f;
  --p0:#f2a25e; --p1:#82b2e8; --p2:#b8c45c; --p3:#ef8aac;
    --snowfill:#e6edf5; --snowline:#3a4a5e; --smoke:#8394a8;
    --day-top:#2b4566; --day-bot:#18263a;
    --sky-ink-day:#e5ecf4; --sky-sub-day:#a3b2c3;
  color-scheme:dark;
}
:root[data-mode="light"]{color-scheme:light}
:root[data-sky="night"]{--on-sky:var(--sky-ink-night);--on-sky-sub:var(--sky-sub-night)}
.eyebrow,.who small,.pos,.status{color:var(--on-sky-sub)!important;transition:color 1s}
h1,.pos strong{color:var(--on-sky);transition:color 1s}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;font-weight:400;overflow-x:hidden}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-block:36px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{text-align:center;display:flex;flex-direction:column;gap:4px}
.scene{display:block;width:280px;max-width:100%;height:auto;margin:0 auto 6px}
.smoke{opacity:0;transform-box:fill-box;transform-origin:center;animation:smoke 6s ease-out infinite}
.smoke.s2{animation-delay:-1.5s}.smoke.s3{animation-delay:-3s}.smoke.s4{animation-delay:-4.5s}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}12%{opacity:.85}100%{transform:translate(12px,-30px) scale(2.1);opacity:0}}
@media (prefers-reduced-motion:reduce){.smoke{animation:none}.smoke.s1{opacity:.7}.smoke.s2{opacity:.5;transform:translate(4px,-10px) scale(1.4)}}
/* 낮(07~18시)에는 불 켜짐, 밤에는 꺼짐 */
.win{fill:#4c5768;transition:fill .6s}
.glow{fill:#ffd66b;opacity:0;transition:opacity .6s}
.scene.lit .win{fill:#f5cd73}
.scene.lit .glow{opacity:.35}
.eyebrow{font-size:11px;letter-spacing:.28em;color:var(--sub);font-variant-numeric:tabular-nums}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,6.5vw,32px);margin:0;letter-spacing:-.01em;text-wrap:balance}

.who{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.who small{font-size:12px;color:var(--sub);margin-right:2px}
.pchip{border:0;background:var(--pcs);color:var(--on);border-radius:999px;padding:3px 10px;font-size:12px;line-height:1.5;font-weight:500;display:inline-flex;align-items:center;gap:5px;opacity:.55;transition:opacity .15s,box-shadow .15s}
.pchip:hover{opacity:.8}
.pchip i{font-style:normal;font-size:12px;display:none}
.pchip[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 1.5px var(--bg),0 0 0 3px var(--pcs)}
.pchip[aria-pressed="true"] i{display:inline}
.pchip i{font-size:10px}

.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 16px;position:relative}
.daylabel{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
.daylabel strong{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.daylabel span{font-size:14px;color:var(--sub)}
.today{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--accent);background:var(--soft);border-radius:6px;padding:1px 7px;font-style:normal}
.gotoday{border:0;background:none;color:var(--accent);font-size:12px;padding:2px 4px;text-decoration:underline;text-underline-offset:3px}
.ibtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink);flex-shrink:0}
.ibtn:disabled{opacity:.3;cursor:default}
.ibtn svg{width:18px;height:18px}
.ibtn[aria-expanded="true"]{background:var(--soft);border-color:var(--accent)}

.cal{position:absolute;right:0;top:calc(100% + 8px);z-index:20;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px -16px var(--shadow);padding:14px;width:min(320px,calc(100vw - 32px));display:flex;flex-direction:column;gap:14px}
.cal h3{margin:0 0 6px;font-size:13px;font-weight:500;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.grid .w{font-size:11px;color:var(--sub);padding:2px 0}
.grid button,.grid .x{aspect-ratio:1;border:0;background:none;border-radius:10px;font-size:13px;font-variant-numeric:tabular-nums;position:relative;display:grid;place-items:center}
.grid .x{color:var(--sub);opacity:.35}
.grid button:hover:not(:disabled){background:var(--soft)}
.grid button:disabled{color:var(--sub);opacity:.4;cursor:default}
.grid button.is-today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.grid button.sel{background:var(--accent);color:var(--card);font-weight:500}
.grid button .dots{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.grid button .dots b{width:4px;height:4px;border-radius:50%;background:var(--pc)}
.cal-note{font-size:11px;color:var(--sub);margin:0}
.dayctl{display:flex;gap:4px;flex-shrink:0}
.list{width:min(380px,calc(100vw - 32px));max-height:min(62vh,520px);overflow-y:auto;padding:8px;gap:2px;overscroll-behavior:contain}
.list h3{display:flex;align-items:center;gap:7px;margin:10px 8px 4px;color:var(--tc)}
.list h3:first-child{margin-top:4px}
.list h3 i{width:8px;height:8px;border-radius:50%;background:var(--tc)}
.li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:10px;font-size:14px}
.li:hover:not(:disabled){background:var(--soft)}
.li:disabled{opacity:.4;cursor:default}
.li.sel{background:color-mix(in srgb,var(--tc) 14%,var(--card))}
.li .dt{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.li .qq{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .rt{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--sub)}
.li .rt b{width:6px;height:6px;border-radius:50%;background:var(--pc)}
.li .rt .ck{color:var(--accent);font-weight:700;margin-left:3px}

.topics{display:flex;flex-direction:column;gap:10px}
.tchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tchips::-webkit-scrollbar{display:none}
.tchips>:first-child{margin-left:auto}.tchips>:last-child{margin-right:auto}
.tchip{flex-shrink:0;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px 6px 9px;font-size:13px;display:inline-flex;align-items:center;gap:7px;color:var(--sub)}
.tchip i{width:10px;height:10px;border-radius:50%;background:var(--tc)}
.tchip em{font-style:normal;font-size:11px;font-variant-numeric:tabular-nums;opacity:.8}
.tchip:disabled{opacity:.45;cursor:default}
.tchip[aria-pressed="true"]{color:var(--ink);border-color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,var(--card));font-weight:500}
.jump{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;font-size:14px;appearance:auto}

.stage{position:relative;z-index:2;touch-action:pan-y;isolation:isolate;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 14px 34px -22px var(--shadow)}
.scenebox{position:relative;display:block}
.scenebox i{position:absolute;inset:0;transition:opacity 60s linear}
.scenebox .mday{background:linear-gradient(180deg,var(--day-top),var(--card))}
.scenebox .mdusk{background:linear-gradient(180deg,#5d6d9e,#c98aa0 60%,#f2b38a);opacity:0}
.scenebox .mnight{background:linear-gradient(180deg,#0b1424,#22324d);opacity:0}
.stage .scene{position:relative;display:block;width:100%;max-width:none;margin:0}
.stage .card{border:0;border-radius:0;box-shadow:none;padding-top:6px}
.card{position:relative;z-index:2;background:var(--card);background-color:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 22px 18px;box-shadow:0 14px 34px -22px var(--shadow);display:flex;flex-direction:column}
.card.go-next{animation:inR .28s ease}
.card.go-prev{animation:inL .28s ease}
@keyframes inR{from{opacity:.2;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:.2;transform:translateX(-26px)}to{opacity:1;transform:none}}
.cmeta{display:flex;align-items:center;gap:10px}
.cno{font-size:40px;font-weight:300;line-height:1;color:var(--tc);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ctopic{display:flex;flex-direction:column;line-height:1.3}
.ctopic b{font-size:13px;font-weight:500;color:var(--tc)}
.ctopic span{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.cq{font-family:var(--f-display);font-weight:500;font-size:clamp(22px,5.6vw,26px);line-height:1.35;margin:16px 0 18px;text-wrap:balance}
.ans{border-top:1px solid var(--line);padding:11px 0 9px;display:flex;flex-direction:column;gap:3px}
.ans label,.ans .nm{font-size:12px;font-weight:500;color:var(--pc);display:flex;align-items:center;gap:6px}
.ans .nm small,.ans label small{font-weight:400;color:var(--sub)}
.ans .txt{white-space:pre-wrap;word-break:break-word;font-size:15px;min-height:24px}
.ans .txt.empty{color:var(--sub);opacity:.6;font-size:14px}
.ans.mine{border-top:0;margin:4px -12px 2px;padding:12px;border-radius:16px;background:color-mix(in srgb,var(--pc) 9%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 30%,transparent)}
.ans.mine+.ans{border-top:0}
.ans textarea{width:100%;border:0;background:transparent;resize:none;outline:none;padding:0;font-size:15px;line-height:1.6;min-height:48px;display:block}
.ans textarea::placeholder{color:var(--sub);opacity:.7}
.hint{border-top:1px solid var(--line);padding:12px 0 4px;font-size:13px;color:var(--sub)}

.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav .ibtn{width:46px;height:46px;border-radius:50%}
.pos{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;text-align:center}
.pos strong{color:var(--ink);font-weight:500}
.track{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--tc,var(--accent));transition:width .25s}
.status{text-align:center;font-size:12px;color:var(--sub);min-height:18px}

.mode{position:fixed;z-index:30;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.mode>button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);box-shadow:0 8px 20px -10px var(--shadow);display:grid;place-items:center}
.mode>button svg{width:20px;height:20px}
.mode .menu{position:absolute;right:0;bottom:56px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:0 14px 30px -14px var(--shadow);display:flex;flex-direction:column;min-width:120px}
.mode .menu button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:9px;font-size:13px;display:flex;align-items:center;gap:8px}
.mode .menu button svg{width:16px;height:16px}
.mode .menu button:hover{background:var(--soft)}
.mode .menu button[aria-checked="true"]{color:var(--accent);font-weight:500}

/* 하늘: 서울 일출·일몰 시각에 맞춰 낮/노을/밤 층의 투명도를 JS가 조절 */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.sky i{position:absolute;inset:0;transition:opacity 60s linear}
.sky .day{background:linear-gradient(180deg,var(--day-top),var(--day-bot))}
.sky .dusk{background:linear-gradient(180deg,#5d6d9e 0%,#c98aa0 55%,#f2b38a 100%);opacity:0}
.sky .night{background:linear-gradient(180deg,#0b1424,#1a2840);opacity:0}
.snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.wrap{isolation:isolate}
.snow i{position:absolute;top:-12px;border-radius:50%;background:var(--snow);opacity:.75;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(18px,55vh,0)}100%{transform:translate3d(-6px,110vh,0)}}
@media (prefers-reduced-motion:reduce){.snow{display:none}.card.go-next,.card.go-prev{animation:none}}
@media (max-width:420px){.stage{border-radius:20px}.stage .card{padding:6px 16px 14px}.ans.mine{margin:4px -8px 2px;padding:10px 8px}.daylabel strong{font-size:18px}}
</style>
</head>
<body>

<div class="sky" aria-hidden="true"><i class="day"></i><i class="dusk" id="skydusk"></i><i class="night" id="skynight"></i></div>
<div class="snow" id="snow" aria-hidden="true"></div>

<main class="wrap">
  <header>
    <div class="eyebrow">2026 · 11.18 — 12.31</div>
    <h1>올해의 나 수집하기</h1>
  </header>

  <div class="who" role="group" aria-label="나는 누구인가요">
    <small>나는</small><span id="people" style="display:contents"></span>
  </div>

  <div class="daybar">
    <div class="daylabel" id="daylabel"></div>
    <div class="dayctl">
      <button class="ibtn" id="listbtn" aria-label="질문 목록" aria-expanded="false" aria-controls="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="17.5" r="1" fill="currentColor"/></svg></button>
      <button class="ibtn" id="calbtn" aria-label="날짜 고르기" aria-expanded="false" aria-controls="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
    </div>
    <div class="cal" id="cal" hidden></div>
    <div class="cal list" id="list" hidden></div>
  </div>

  <div class="stage" id="stage">
  <div class="scenebox"><i class="mday"></i><i class="mdusk"></i><i class="mnight"></i>
    <svg class="scene" viewBox="0 0 280 118" role="img" aria-label="눈 덮인 오두막과 눈사람">
      <!-- 땅 -->
      <path d="M0 104 Q70 92 140 100 T280 98 V118 H0Z" fill="var(--card)"/>
      <path d="M0 104 Q70 92 140 100 T280 98" fill="none" stroke="var(--snowline)" stroke-width="1.2"/>
      <!-- 작은 나무 -->
      <g transform="translate(34 58)">
        <rect x="-2.5" y="34" width="5" height="10" rx="1.5" fill="#8b6447"/>
        <path d="M0 0 L16 22 H8 L19 36 H-19 L-8 22 H-16Z" fill="#5f8f78"/>
        <path d="M0 0 L7 10 Q0 13 -7 10Z M-11 23 Q0 27 11 23 L13 26 Q0 30 -13 26Z" fill="var(--snowfill)"/>
      </g>
      <g transform="translate(250 66) scale(.75)">
        <rect x="-2.5" y="34" width="5" height="10" rx="1.5" fill="#8b6447"/>
        <path d="M0 0 L16 22 H8 L19 36 H-19 L-8 22 H-16Z" fill="#6f9c86"/>
        <path d="M0 0 L7 10 Q0 13 -7 10Z M-11 23 Q0 27 11 23 L13 26 Q0 30 -13 26Z" fill="var(--snowfill)"/>
      </g>
      <!-- 오두막 -->
      <g>
        <circle class="smoke s1" cx="135" cy="24" r="4.5" fill="var(--smoke)"/>
        <circle class="smoke s2" cx="135" cy="24" r="4.5" fill="var(--smoke)"/>
        <circle class="smoke s3" cx="135" cy="24" r="4.5" fill="var(--smoke)"/>
        <circle class="smoke s4" cx="135" cy="24" r="4.5" fill="var(--smoke)"/>
        <rect x="129" y="30" width="12" height="22" fill="#9a5f48"/>
        <rect x="127" y="27" width="16" height="6" rx="3" fill="var(--snowfill)"/>
        <rect x="68" y="60" width="86" height="40" fill="#b8865e"/>
        <g stroke="#9c6e4b" stroke-width="1"><path d="M68 70h86M68 80h86M68 90h86"/></g>
        <path d="M60 63 L111 31 L162 63Z" fill="#8f5a42"/>
        <path d="M57 64 L111 29 L165 64 Q160 70 154 66 Q149 72 142 66 Q134 71 126 66 Q118 72 110 66 Q100 71 92 66 Q84 72 76 66 Q69 71 63 66 Q59 69 57 64Z" fill="var(--snowfill)"/>
        <rect x="102" y="76" width="18" height="24" rx="2" fill="#7a4b35"/>
        <circle cx="116" cy="89" r="1.3" fill="#e9c27a"/>
        <rect class="glow" x="73" y="68" width="25" height="23" rx="6"/>
        <rect class="glow" x="126" y="68" width="25" height="23" rx="6"/>
        <rect class="win" x="77" y="72" width="17" height="15" rx="2"/>
        <path d="M85.5 72v15M77 79.5h17" stroke="#b8865e" stroke-width="1.6"/>

<script>
(function(){
var NAMES=['수연','지아','주연','주영'];
var TOPICS=[
 ['좋아했던 것',['자주 들은 노래','다시 먹고 싶은 음식','마음에 든 장소','오래 남은 작품','눈길이 간 색','자주 입은 옷','손이 많이 간 문구','좋아하는 사진 한 장','소소한 즐거움','나만의 소중한 물건']],
 ['새로 발견한 것',['처음 해본 일','뜻밖의 취향','써먹어 본 배움','우연히 발견한 공간','추천받아 좋아진 것','새로 구독한 채널','생각보다 쉬웠던 일','생활을 바꾼 도구','나와 안 맞았던 것','최근 알게 된 사실']],
 ['달라진 나',['덜 좋아하게 된 것','새로 생긴 관심사','달라진 소비 기준','조금 익숙해진 일','그만두기로 한 것','내 취향대로 한 선택','생각이 바뀐 계기','자주 했던 말','스스로 기특했던 일','올해 초와 달라진 나']],
 ['마음에 남은 순간',['작은 행복을 느낀 순간','크게 웃었던 기억','에너지가 빠진 순간','기운을 되찾은 방법','혼자라서 좋았던 시간','함께라서 좋았던 시간','오래 남은 한마디','고마웠던 배려','기대와 달랐던 경험','요즘 마음을 차지한 것']],
 ['앞으로 남길 것',['올해 잘 산 물건','다시는 안 살 물건','돈 없이 즐긴 것','아깝지 않았던 시간','기억하고 싶은 하루','다시 꺼내고 싶은 취미','아직 해보고 싶은 일','이어가고 싶은 습관','내년에도 함께할 사람','기록하며 발견한 나']]
];
var Q=[];TOPICS.forEach(function(t,ti){t[1].forEach(function(q,k){Q.push({t:ti,k:k,q:q})})});
/* 원본 일정(11.12 시작, 하루 한 질문)을 그대로 따른다: 11.18 = 원본 7번째 질문, 12.31 = 50번째 */
var SRC_START=new Date(2026,10,12);
var WD='일월화수목금토';
function pad(n){return String(n).padStart(2,'0')}
var DAYS=[];
for(var d=new Date(2026,10,18);d<=new Date(2026,11,31);d.setDate(d.getDate()+1)){
  var qi=Math.round((d-SRC_START)/864e5);
  DAYS.push({key:pad(d.getMonth()+1)+pad(d.getDate()),m:d.getMonth()+1,d:d.getDate(),w:d.getDay(),y:d.getFullYear(),q:qi});
}
var now=new Date();now.setHours(0,0,0,0);
var todayIdx=-1;DAYS.forEach(function(x,i){if(x.y===now.getFullYear()&&x.m===now.getMonth()+1&&x.d===now.getDate())todayIdx=i});
var lastOpen=todayIdx>=0?todayIdx:(now<new Date(2026,10,18)?0:DAYS.length-1);
var topicDays=TOPICS.map(function(_,ti){var r=[];DAYS.forEach(function(x,i){if(Q[x.q].t===ti)r.push(i)});return r});

function $(id){return document.getElementById(id)}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}

var me=-1,dayIdx=lastOpen,cache={},dirty={},seq={},timers={},inflight={},again={},db=null,ready=false,mode='system';
var m0=ls('ynm-me');if(m0!==null&&m0!==''&&+m0>=0&&+m0<4)me=+m0;
try{var c0=ls('ynm-cache');if(c0){var o=JSON.parse(c0);if(o&&typeof o==='object')cache=o}}catch(e){}

function did(dk,p){return dk+'_'+p}
function ansDay(i,p){var x=DAYS[i],r=cache[did(x.key,p)];return r&&r.a&&typeof r.a[x.q]==='string'?r.a[x.q]:''}
function persist(){try{localStorage.setItem('ynm-cache',JSON.stringify(cache))}catch(e){}}
function status(t){$('status').textContent=t||''}

/* ---------- 사람 선택 ---------- */
function drawPeople(){
  var h=$('people');h.innerHTML='';
  NAMES.forEach(function(n,i){
    var b=document.createElement('button');b.className='pchip';b.type='button';
    b.style.setProperty('--pcs','var(--pcs'+i+')');
    b.setAttribute('aria-pressed',i===me?'true':'false');
    b.innerHTML='<i aria-hidden="true">✓</i>';b.appendChild(document.createTextNode(n));
    b.onclick=function(){me=i;ls('ynm-me',String(i));drawPeople();drawAll(0)};
    h.appendChild(b);
  });
}

/* ---------- 날짜 ---------- */
function drawDay(){
  var x=DAYS[dayIdx],h=$('daylabel');h.innerHTML='';
  var s=document.createElement('strong');s.textContent=pad(x.m)+'.'+pad(x.d);h.appendChild(s);
  var w=document.createElement('span');w.textContent=WD[x.w]+'요일';h.appendChild(w);
  if(dayIdx===todayIdx){var t=document.createElement('em');t.className='today';t.textContent='TODAY';h.appendChild(t)}
  else if(todayIdx>=0){var g=document.createElement('button');g.className='gotoday';g.type='button';g.textContent='오늘로';g.onclick=function(e){e.stopPropagation();go(todayIdx)};h.appendChild(g)}
}
function whoWrote(i){var r=[];for(var p=0;p<4;p++)if(ansDay(i,p))r.push(p);return r}
function drawCal(){
  var c=$('cal');c.innerHTML='';
  [[11,'11월'],[12,'12월']].forEach(function(mm){
    var box=document.createElement('div');
    var h=document.createElement('h3');h.textContent='2026년 '+mm[1];box.appendChild(h);
    var g=document.createElement('div');g.className='grid';
    for(var k=0;k<7;k++){var w=document.createElement('div');w.className='w';w.textContent=WD[k];g.appendChild(w)}
    var first=new Date(2026,mm[0]-1,1).getDay(),len=new Date(2026,mm[0],0).getDate();
    for(var k2=0;k2<first;k2++)g.appendChild(document.createElement('span'));
    for(var dd=1;dd<=len;dd++){
      var key=pad(mm[0])+pad(dd),idx=-1;
      DAYS.forEach(function(x,i){if(x.key===key)idx=i});
      if(idx<0){var x=document.createElement('span');x.className='x';x.textContent=dd;g.appendChild(x);continue}
      var b=document.createElement('button');b.type='button';b.textContent=dd;
      if(idx===dayIdx)b.className='sel';
      if(idx===todayIdx)b.classList.add('is-today');
      if(idx>lastOpen){b.disabled=true;b.setAttribute('aria-label',mm[0]+'월 '+dd+'일 (아직 열리지 않음)')}
      else{
        b.setAttribute('aria-label',mm[0]+'월 '+dd+'일 · '+Q[DAYS[idx].q].q);
        (function(i){b.onclick=function(){go(i)}})(idx);
        var wr=whoWrote(idx);
        if(wr.length){var ds=document.createElement('span');ds.className='dots';wr.forEach(function(p){var bb=document.createElement('b');bb.style.setProperty('--pc','var(--p'+p+')');ds.appendChild(bb)});b.appendChild(ds)}
      }
      g.appendChild(b);
    }
    box.appendChild(g);c.appendChild(box);
  });
  var n=document.createElement('p');n.className='cal-note';n.textContent='점 색깔은 그날 답을 쓴 사람이에요. 오늘까지의 질문만 열려요.';c.appendChild(n);
}
function openCal(){closeList();drawCal();$('cal').hidden=false;$('calbtn').setAttribute('aria-expanded','true')}
function closeCal(){$('cal').hidden=true;$('calbtn').setAttribute('aria-expanded','false')}
$('calbtn').onclick=function(e){e.stopPropagation();$('cal').hidden?openCal():closeCal()};
$('cal').addEventListener('click',function(e){e.stopPropagation()});

/* ---------- 질문 목록 ---------- */
function drawList(){
  var h=$('list');h.innerHTML='';
  TOPICS.forEach(function(t,ti){
    var hd=document.createElement('h3');hd.style.setProperty('--tc','var(--t'+ti+')');hd.innerHTML='<i></i>';hd.appendChild(document.createTextNode(t[0]));h.appendChild(hd);
    topicDays[ti].forEach(function(i){
      var x=DAYS[i],b=document.createElement('button');b.type='button';b.className='li'+(i===dayIdx?' sel':'');
      b.style.setProperty('--tc','var(--t'+ti+')');
      var dt=document.createElement('span');dt.className='dt';dt.textContent=pad(x.m)+'.'+pad(x.d)+' ('+WD[x.w]+')';b.appendChild(dt);
      var qq=document.createElement('span');qq.className='qq';qq.textContent=Q[x.q].q;b.appendChild(qq);
      var rt=document.createElement('span');rt.className='rt';
      if(i>lastOpen){b.disabled=true;rt.textContent='아직'}
      else{whoWrote(i).forEach(function(p){var bb=document.createElement('b');bb.style.setProperty('--pc','var(--p'+p+')');rt.appendChild(bb)});
        if(me>=0&&ansDay(i,me)){var ck=document.createElement('span');ck.className='ck';ck.textContent='✓';rt.appendChild(ck)}
        b.onclick=function(){go(i)}}
      b.appendChild(rt);
      b.setAttribute('aria-label',x.m+'월 '+x.d+'일 · '+Q[x.q].q+(i>lastOpen?' (아직 열리지 않음)':''));
      h.appendChild(b);
    });
  });
}
function openList(){closeCal();drawList();$('list').hidden=false;$('listbtn').setAttribute('aria-expanded','true');
  var s=$('list').querySelector('.li.sel');if(s)$('list').scrollTop=s.offsetTop-$('list').clientHeight/2}
function closeList(){$('list').hidden=true;$('listbtn').setAttribute('aria-expanded','false')}
$('listbtn').onclick=function(e){e.stopPropagation();$('list').hidden?openList():closeList()};
$('list').addEventListener('click',function(e){e.stopPropagation()});

/* ---------- 주제·질문 ---------- */
function myCount(ti){if(me<0)return null;var n=0;topicDays[ti].forEach(function(i){if(ansDay(i,me))n++});return n}
function drawTopics(){
  var h=$('tchips'),cur=Q[DAYS[dayIdx].q].t;h.innerHTML='';
  TOPICS.forEach(function(t,ti){
    var days=topicDays[ti],open=days.filter(function(i){return i<=lastOpen});
    var b=document.createElement('button');b.className='tchip';b.type='button';
    b.style.setProperty('--tc','var(--t'+ti+')');
    b.setAttribute('aria-pressed',cur===ti?'true':'false');
    b.innerHTML='<i></i>';b.appendChild(document.createTextNode(t[0]));
    var em=document.createElement('em');var c=myCount(ti);
    em.textContent=(c===null?'':c+'/')+days.length+'일';b.appendChild(em);
    if(!open.length){b.disabled=true;b.title=DAYS[days[0]].m+'.'+DAYS[days[0]].d+'부터 열려요'}
    b.onclick=function(){
      if(open.indexOf(dayIdx)>=0)return;
      var target=open[0];
      if(me>=0){for(var k=0;k<open.length;k++){if(!ansDay(open[k],me)){target=open[k];break}}}
      go(target)};
    h.appendChild(b);
    if(cur===ti&&h.scrollWidth>h.clientWidth){h.scrollTo({left:Math.max(0,b.offsetLeft-h.offsetLeft-12),behavior:'smooth'})}
  });
}

/* ---------- 카드 ---------- */
function size(t){t.style.height='auto';t.style.height=Math.max(48,t.scrollHeight)+'px'}
function drawCard(dir){
  var day=DAYS[dayIdx],x=Q[day.q],c=$('card'),tdays=topicDays[x.t];
  c.style.setProperty('--tc','var(--t'+x.t+')');
  c.innerHTML='';
  var meta=document.createElement('div');meta.className='cmeta';
  var no=document.createElement('div');no.className='cno';no.textContent=pad(dayIdx+1);meta.appendChild(no);
  var tp=document.createElement('div');tp.className='ctopic';
  var tb=document.createElement('b');tb.textContent=TOPICS[x.t][0];tp.appendChild(tb);
  meta.appendChild(tp);c.appendChild(meta);
  var q=document.createElement('h2');q.className='cq';q.textContent=x.q;c.appendChild(q);
  if(me<0){var hi=document.createElement('div');hi.className='hint';hi.textContent='위에서 나를 먼저 골라야 답을 쓸 수 있어요.';c.appendChild(hi)}
  var order=[];if(me>=0)order.push(me);for(var p=0;p<4;p++)if(p!==me)order.push(p);
  order.forEach(function(p){
    var row=document.createElement('div');row.className='ans'+(p===me?' mine':'');
    row.style.setProperty('--pc','var(--p'+p+')');
    var v=ansDay(dayIdx,p);
    if(p===me){
      var lb=document.createElement('label');lb.htmlFor='mine';lb.textContent=NAMES[p];
      var sm=document.createElement('small');sm.textContent='· 나';lb.appendChild(sm);row.appendChild(lb);
      var ta=document.createElement('textarea');ta.id='mine';ta.rows=2;ta.maxLength=600;
      ta.placeholder=ready?'여기에 적어요':'기록을 불러오는 중이에요…';ta.readOnly=!ready;
      ta.value=v;row.appendChild(ta);
      ta.addEventListener('input',function(){size(ta);edit(ta.value)});
      setTimeout(function(){size(ta)},0);
    }else{
      var nm=document.createElement('div');nm.className='nm';nm.textContent=NAMES[p];row.appendChild(nm);
      var tx=document.createElement('div');tx.className='txt'+(v?'':' empty');tx.dataset.p=p;tx.textContent=v||'아직 안 썼어요';row.appendChild(tx);
    }
    c.appendChild(row);
  });
  c.classList.remove('go-next','go-prev');
  if(dir){void c.offsetWidth;c.classList.add(dir>0?'go-next':'go-prev')}
  $('prev').disabled=dayIdx<=0;$('next').disabled=dayIdx>=lastOpen;
  drawPos();
  $('track').style.setProperty('--tc','var(--t'+x.t+')');
  $('bar').style.width=((dayIdx+1)/DAYS.length*100)+'%';
}
function drawPos(){
  var pos=$('pos');pos.innerHTML='';
  var st=document.createElement('strong');st.textContent=pad(dayIdx+1)+'일째';pos.appendChild(st);
  var tail=' / '+DAYS.length+'일';
  if(me>=0){var n=0;for(var i=0;i<=lastOpen;i++)if(ansDay(i,me))n++;tail+=' · 내가 쓴 날 '+n+'일'}
  pos.appendChild(document.createTextNode(tail));
}
function drawAll(dir){drawDay();drawTopics();drawCard(dir);if(!$('cal').hidden)drawCal();if(!$('list').hidden)drawList()}
function go(i){i=Math.max(0,Math.min(lastOpen,i));closeCal();closeList();if(i===dayIdx)return;var dir=i>dayIdx?1:-1;dayIdx=i;drawAll(dir)}
$('prev').onclick=function(){go(dayIdx-1)};
$('next').onclick=function(){go(dayIdx+1)};

/* 다른 사람 답만 갱신 (내 입력 칸은 쓰는 중이면 건드리지 않음) */
function refresh(){
  document.querySelectorAll('#card .txt').forEach(function(e){var v=ansDay(dayIdx,+e.dataset.p);e.textContent=v||'아직 안 썼어요';e.classList.toggle('empty',!v)});
  var t=$('mine');if(t){t.readOnly=!ready;t.placeholder=ready?'여기에 적어요':'기록을 불러오는 중이에요…';if(document.activeElement!==t){var v=ansDay(dayIdx,me);if(t.value!==v){t.value=v;size(t)}}}
  if(!$('cal').hidden)drawCal();
  if(!$('list').hidden){var st=$('list').scrollTop;drawList();$('list').scrollTop=st}
}
function refreshCounts(){
  $('tchips').querySelectorAll('.tchip').forEach(function(b,ti){var em=b.querySelector('em'),c=myCount(ti);if(em)em.textContent=(c===null?'':c+'/')+topicDays[ti].length+'일'});
  drawPos();
}

/* 스와이프 · 키보드 */
var sx=null,sy=null;
$('stage').addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$('stage').addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4)go(dayIdx+(dx<0?1:-1))});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeCal();closeList();closeMode();return}
  var tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(tag==='TEXTAREA'||tag==='SELECT'||tag==='INPUT')return;
  if(e.key==='ArrowRight')go(dayIdx+1);else if(e.key==='ArrowLeft')go(dayIdx-1);
});

/* ---------- 저장 (구글 시트 웹 앱) ---------- */
/* 아래 따옴표 안에 Apps Script 웹 앱 주소(…/exec)를 붙여 넣으세요 */
var PASTE_WEB_APP_URL_HERE='https://script.google.com/macros/s/AKfycbwDl2KDDHeyyQHfxffIwkR2xoVyYFlJX1mYk0YSQg0ao1NP5Eu6IbuWD4rqFdLwJLIqsA/exec';
var API_URL=PASTE_WEB_APP_URL_HERE;
var apiOk=/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec$/.test(API_URL);
function edit(text){
  if(me<0||!ready)return;
  var day=DAYS[dayIdx],id=did(day.key,me);
  var r=cache[id]||(cache[id]={d:day.key,p:me,a:{},t:0});r.a=Object.assign({},r.a||{});
  if(text.trim())r.a[day.q]=text;else delete r.a[day.q];
  r.t=Date.now();
  dirty[id]=true;seq[id]=(seq[id]||0)+1;persist();
  status(apiOk?'저장 중…':'이 기기에 저장됐어요');
  clearTimeout(timers[id]);timers[id]=setTimeout(function(){flush(id)},800);
  refreshCounts();
}
function flush(id,retry){
  if(!apiOk){delete dirty[id];return}
  if(inflight[id]){again[id]=true;return}
  inflight[id]=true;
  var r=cache[id],mySeq=seq[id],a={};
  Object.keys(r.a||{}).forEach(function(k){if(r.a[k])a[k]=r.a[k]});
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({id:id,d:r.d,p:r.p,a:a,t:r.t})})
    .then(function(res){return res.json()})
    .then(function(j){
      inflight[id]=false;
      if(!j||!j.ok)throw new Error((j&&j.error)||'fail');
      if(again[id]){again[id]=false;flush(id);return}
      if(seq[id]===mySeq)delete dirty[id];
      status('저장됨 · 모두에게 보여요');
    })
    .catch(function(){
      inflight[id]=false;
      if(!retry){setTimeout(function(){flush(id,true)},1500);return}
      status('저장하지 못했어요. 이 기기에는 남아 있으니 인터넷 연결을 확인한 뒤 다시 입력해 주세요.');
    });
}

/* ---------- 불러오기 (몇 초마다) ---------- */
function clean(v){var a={};if(v&&v.a&&typeof v.a==='object')Object.keys(v.a).forEach(function(k){var n=+k;if(n>=0&&n<Q.length&&typeof v.a[k]==='string')a[n]=v.a[k].slice(0,600)});return a}
var loading=false,firstLoad=true,failed=false;
function pull(){
  if(!apiOk||loading)return;loading=true;
  fetch(API_URL+'?t='+Date.now()).then(function(res){return res.json()}).then(function(j){
    loading=false;
    if(!j||!j.ok||!Array.isArray(j.entries))throw new Error('bad');
    j.entries.forEach(function(v){
      var id=String(v.id||''),p=+v.p;
      if(!/^\d{4}_[0-3]$/.test(id)||!(p>=0&&p<4))return;
      if(dirty[id])return;
      var t=+v.t||0,loc=cache[id];
      if(loc&&loc.t&&loc.t>t)return;
      cache[id]={d:String(v.d||id.slice(0,4)),p:p,a:clean(v),t:t};
    });
    persist();
    if(firstLoad||failed){firstLoad=false;failed=false;status('함께 보는 중이에요 · 몇 초마다 새로 불러와요')}
    ready=true;refresh();refreshCounts();
  }).catch(function(){
    loading=false;failed=true;ready=true;refresh();
    status('친구들 답을 불러오지 못했어요 · 인터넷 연결을 확인해 주세요');
  });
}
function connect(){
  if(!apiOk){ready=true;refresh();status('아직 구글 시트와 연결 전이에요 · 이 기기에만 저장돼요');return}
  status('친구들 기록을 불러오는 중이에요…');
  pull();
  setInterval(function(){if(!document.hidden)pull()},6000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)pull()});
}

/* ---------- 화면 모드 ---------- */
var ICON={
 system:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16.5V20"/></svg>',
 light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
 dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'
};
var LABEL={system:'시스템',light:'라이트',dark:'다크'};
function applyMode(m){mode=m;var r=document.documentElement;if(m==='system')r.removeAttribute('data-mode');else r.setAttribute('data-mode',m);ls('ynm-mode',m);
  $('modebtn').innerHTML=ICON[m];$('modebtn').setAttribute('aria-label','화면 모드: '+LABEL[m]);drawMenu()}
function drawMenu(){var h=$('modemenu');h.innerHTML='';['system','light','dark'].forEach(function(k){var b=document.createElement('button');b.type='button';b.setAttribute('role','menuitemradio');b.setAttribute('aria-checked',k===mode?'true':'false');b.innerHTML=ICON[k];b.appendChild(document.createTextNode(LABEL[k]));b.onclick=function(){applyMode(k);closeMode()};h.appendChild(b)})}
function closeMode(){$('modemenu').hidden=true;$('modebtn').setAttribute('aria-expanded','false')}
$('modebtn').onclick=function(e){e.stopPropagation();var h=$('modemenu');h.hidden=!h.hidden;$('modebtn').setAttribute('aria-expanded',h.hidden?'false':'true')};
$('modemenu').addEventListener('click',function(e){e.stopPropagation()});
document.addEventListener('click',function(){closeCal();closeList();closeMode()});
var md=ls('ynm-mode');applyMode(md==='light'||md==='dark'?md:'system');

/* ---------- 눈 ---------- */
(function(){var s=$('snow'),n=window.innerWidth<600?22:38;for(var i=0;i<n;i++){var e=document.createElement('i'),z=2+Math.random()*4.5;
  e.style.cssText='left:'+(Math.random()*100)+'%;width:'+z+'px;height:'+z+'px;opacity:'+(.35+Math.random()*.5).toFixed(2)+';animation-duration:'+(10+Math.random()*12).toFixed(1)+'s;animation-delay:-'+(Math.random()*20).toFixed(1)+'s;filter:blur('+(z>5?1:0)+'px)';s.appendChild(e)}})();

/* 서울 기준 대략의 일출·일몰(분): 11.18 07:12/17:18 → 12.31 07:46/17:24 사이를 날짜로 보간 */
function sun(dt){
  var a=new Date(dt.getFullYear(),10,18),b=new Date(dt.getFullYear(),11,31);
  var k=Math.max(0,Math.min(1,(dt-a)/(b-a)));
  return {rise:432+k*34,set:1038+k*6};
}
function clamp01(v){return Math.max(0,Math.min(1,v))}
function skyTick(){
  var n=new Date(),t=n.getHours()*60+n.getMinutes()+n.getSeconds()/60,s=sun(n),R=40;
  /* f: 1=낮, 0=밤. 일출·일몰 앞뒤 40분씩 서서히 바뀜 */
  var f=Math.min(clamp01((t-(s.rise-R))/(2*R)),clamp01(((s.set+R)-t)/(2*R)));
  var no=(1-f).toFixed(3),du=(4*f*(1-f)*.85).toFixed(3);
  $('skynight').style.opacity=no;$('skydusk').style.opacity=du;
  var mn=document.querySelector('.scenebox .mnight'),mdk=document.querySelector('.scenebox .mdusk');
  if(mn)mn.style.opacity=no;if(mdk)mdk.style.opacity=du;
  document.documentElement.setAttribute('data-sky',f>=.5?'day':'night');
  var sc=document.querySelector('.scene');if(sc)sc.classList.toggle('lit',f>=.5);
}
skyTick();setInterval(skyTick,60000);

drawPeople();drawAll(0);connect();
})();
</script>
